name: cdc-scd2-lakehouse

services:
  postgres:
    image: postgres:16
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4"]
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5433:5432"
    volumes:
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"

  connect:
    image: quay.io/debezium/connect:2.7
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: debezium-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      HEAP_OPTS: "-Xms256m -Xmx768m"
    ports:
      - "8083:8083"

  connect-init:
    image: curlimages/curl:8.10.1
    depends_on:
      - connect
    volumes:
      - ./connectors/pg-cdc.json:/pg-cdc.json:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until curl -sf http://connect:8083/connectors >/dev/null; do echo "waiting for Kafka Connect..."; sleep 5; done
        curl -sf -X PUT -H "Content-Type: application/json" --data @/pg-cdc.json http://connect:8083/connectors/pg-cdc/config
        echo; echo "connector pg-cdc registered"

  minio:
    image: bitnamilegacy/minio:2024.10.13
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
      MINIO_DEFAULT_BUCKETS: warehouse
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/bitnami/minio/data

  minio-init:
    image: bitnamilegacy/minio:2024.10.13
    user: root
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 minioadmin minioadmin123; do echo "waiting for MinIO..."; sleep 3; done
        mc mb --ignore-existing local/warehouse

  catalog-db:
    image: postgres:16
    environment:
      POSTGRES_USER: lakekeeper
      POSTGRES_PASSWORD: lakekeeper
      POSTGRES_DB: lakekeeper
    volumes:
      - catalog-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lakekeeper -d lakekeeper"]
      interval: 5s
      retries: 20

  lakekeeper-migrate:
    image: quay.io/lakekeeper/catalog:latest-main
    depends_on:
      catalog-db:
        condition: service_healthy
    environment: &lakekeeper-env
      LAKEKEEPER__PG_ENCRYPTION_KEY: "change-me-not-secure-demo-key"
      LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://lakekeeper:lakekeeper@catalog-db:5432/lakekeeper
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://lakekeeper:lakekeeper@catalog-db:5432/lakekeeper
    command: ["migrate"]

  lakekeeper:
    image: quay.io/lakekeeper/catalog:latest-main
    depends_on:
      lakekeeper-migrate:
        condition: service_completed_successfully
    environment: *lakekeeper-env
    command: ["serve"]
    ports:
      - "8181:8181"

  lakekeeper-init:
    image: curlimages/curl:8.10.1
    depends_on:
      lakekeeper:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ./lakekeeper/warehouse.json:/warehouse.json:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until curl -sf http://lakekeeper:8181/health >/dev/null; do echo "waiting for Lakekeeper..."; sleep 3; done
        curl -s -X POST -H "Content-Type: application/json" --data '{"accept-terms-of-use": true}' http://lakekeeper:8181/management/v1/bootstrap; echo
        curl -s -X POST -H "Content-Type: application/json" --data @/warehouse.json http://lakekeeper:8181/management/v1/warehouse; echo
        echo "lakekeeper init done (409/400 'already exists' on restart is fine)"

  spark:
    image: apache/spark:3.5.3
    user: root
    depends_on:
      lakekeeper-init:
        condition: service_completed_successfully
      connect-init:
        condition: service_completed_successfully
    environment:
      AWS_REGION: us-east-1
    volumes:
      - ./jobs:/opt/jobs:ro
      - spark-checkpoints:/opt/checkpoints
      - spark-ivy:/tmp/.ivy2
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[2]
      - --driver-memory
      - 1g
      - --conf
      - spark.jars.ivy=/tmp/.ivy2
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3,org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.6.1,org.apache.iceberg:iceberg-aws-bundle:1.6.1
      - /opt/jobs/cdc_to_scd2.py
    restart: on-failure

  trino:
    image: trinodb/trino:460
    depends_on:
      - lakekeeper
    ports:
      - "8080:8080"
    volumes:
      - ./trino/catalog/iceberg.properties:/etc/trino/catalog/iceberg.properties:ro
    mem_limit: 2g

  generator:
    image: python:3.12-slim
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./generator:/app:ro
    command: ["sh", "-c", "pip install -q 'psycopg[binary]' && python -u /app/generator.py"]
    restart: on-failure

volumes:
  pg-data:
  minio-data:
  catalog-data:
  spark-checkpoints:
  spark-ivy:
